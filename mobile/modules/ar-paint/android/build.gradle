plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.arpaint'
version = '0.1.0'

android {
  namespace "expo.modules.arpaint"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // ARCore: planes, depth hit tests, anchors, Cloud Anchors, Geospatial
  implementation 'com.google.ar:core:1.56.0'
  // keyless (OAuth) auth for Cloud Anchors / Geospatial: ARCore looks this up at runtime
  implementation 'com.google.android.gms:play-services-auth:21.3.0'
  // Geospatial API: ARCore reads the fused location provider through this
  implementation 'com.google.android.gms:play-services-location:21.3.0'
  // occlusion by people and hands (PeopleMask): the model ships inside the library
  implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
}
